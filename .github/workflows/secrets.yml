name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # gitleaks walks the commit history, not just the checked out tree.
          fetch-depth: 0

      # The official image is pinned and run directly, so the scan needs no
      # third-party action and no licence key.
      - name: Scan history for leaked secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            "${GITLEAKS_IMAGE}" \
            git /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
