name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @inklethq/sdk
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The whole history, so the tag can be checked against main below.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Pinned: this job holds id-token: write, so the CLI that uses it should
      # change only through a reviewed commit.
      - name: Use an OIDC-compatible npm CLI
        run: npm install --global npm@11.20.0

      - name: Verify tag matches package version
        id: release
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}."
            exit 1
          fi

          if [[ "${package_version}" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag="latest"
            # What `npm install` gets by default has to be what main says it
            # is. Pre-releases may come from a branch; a stable one may not.
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "Stable tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
              exit 1
            fi
          fi

          echo "Publishing ${package_version} with npm dist-tag ${dist_tag}."
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check whether version already exists
        id: registry
        shell: bash
        run: |
          if npm view "@inklethq/sdk@${{ steps.release.outputs.package_version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "@inklethq/sdk@${{ steps.release.outputs.package_version }} is already published; verification will continue without republishing."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Verify package contents
        run: npm run pack:check

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish --tag "${{ steps.release.outputs.dist_tag }}"
